name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_CWS_CREDENTIALS: ${{ secrets.CWS_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed-name copies keep releases/latest/download/blimp-chrome.zip (and the old
          # helium-max-chrome.zip link) pointing at the newest build.
          cp .output/blimp-*-chrome.zip .output/blimp-chrome.zip
          cp .output/blimp-chrome.zip .output/helium-max-chrome.zip
          # Lets anyone check a download with `shasum -a 256 -c SHA256SUMS`.
          (cd .output && sha256sum blimp-*-chrome.zip blimp-chrome.zip helium-max-chrome.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" .output/blimp-*-chrome.zip .output/blimp-chrome.zip .output/helium-max-chrome.zip .output/SHA256SUMS \
            --title "Blimp $GITHUB_REF_NAME" --generate-notes --latest
      - name: Upload to the Chrome Web Store
        # Skipped until the CWS_* repository secrets exist (see store/LISTING.md).
        if: env.HAS_CWS_CREDENTIALS == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4 --source .output/blimp-chrome.zip
