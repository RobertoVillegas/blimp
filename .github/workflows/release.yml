name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed-name copy keeps releases/latest/download/helium-max-chrome.zip pointing at the newest build.
          cp .output/helium-max-*-chrome.zip .output/helium-max-chrome.zip
          # The Mac updater (scripts/install-updater.sh) refuses a zip that doesn't match this.
          (cd .output && sha256sum helium-max-*-chrome.zip helium-max-chrome.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" .output/helium-max-*-chrome.zip .output/helium-max-chrome.zip .output/SHA256SUMS \
            --title "Helium Max $GITHUB_REF_NAME" --generate-notes --latest
